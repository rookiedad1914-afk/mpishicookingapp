# ====================================================================
# Nginx Reverse Proxy Configuration for Sous Chef AI (Mpishi Cooking)
# Designed for LXC Container behind Tailscale or Local LAN
# ====================================================================

# Upstream Node.js application server
upstream sous_chef_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    
    # Replace with your Tailscale MagicDNS name or LAN IP:
    server_name mpishi.tailnet.ts.net localhost;

    # Allow uploading high-resolution recipe photos and bulk backups
    client_max_body_size 50M;

    # Gzip Compression for fast mobile loading
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;

    # Main Application Proxy
    location / {
        proxy_pass http://sous_chef_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Real client IP forwarding
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for AI recipe imports and parsing
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Persistent Storage Images (Direct Cache)
    location /api/images/ {
        proxy_pass http://sous_chef_backend/api/images/;
        proxy_cache_valid 200 30d;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}

